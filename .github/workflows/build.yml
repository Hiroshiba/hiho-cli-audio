name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'package.jsonに設定するバージョン'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build_args: --win
            artifact_name: hiho-cli-audio-windows
            artifact_path: |
              dist/*.exe
              dist/*.blockmap
          - os: macos-latest
            label: macOS
            build_args: --mac
            artifact_name: hiho-cli-audio-macos
            artifact_path: |
              dist/*.dmg
              dist/*.blockmap

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: <Setup> リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: <Setup> pnpmの設定
        uses: pnpm/action-setup@v4

      - name: <Setup> Node.jsとpnpmキャッシュの設定
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: <Setup> 依存関係のインストール
        run: pnpm install

      - name: <Setup> package.jsonのバージョン更新
        run: pnpm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: <Check> TypeScript型チェック
        run: pnpm typecheck

      - name: <Check> ESLintの実行
        run: pnpm lint

      - name: <Build> Electronアプリケーションのビルド
        run: pnpm run build

      - name: <Build> アプリケーションパッケージの作成
        run: pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: <Artifact> 成果物のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
