name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'package.jsonとGitHub Releaseに設定するバージョン。例: 1.0.1'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build_args: --win
            artifact_name: hiho-cli-audio-windows
            artifact_path: |
              dist/*.exe
          - os: macos-latest
            label: macOS
            build_args: --mac
            artifact_name: hiho-cli-audio-macos
            artifact_path: |
              dist/*.dmg

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: <Setup> リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: <Setup> pnpmの設定
        uses: pnpm/action-setup@v4

      - name: <Setup> Node.jsとpnpmキャッシュの設定
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: <Setup> 依存関係のインストール
        run: pnpm install

      - name: <Setup> package.jsonのバージョン更新
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version

      - name: <Check> TypeScript型チェック
        run: pnpm typecheck

      - name: <Check> ESLintの実行
        run: pnpm lint

      - name: <Build> Electronアプリケーションのビルド
        run: pnpm run build

      - name: <Build> アプリケーションパッケージの作成
        run: pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: <Artifact> 成果物のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: <Artifact> 成果物の取得
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: <Release> GitHub Releaseへのデプロイ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            WindowsとmacOSのインストーラーです。
            署名と公証は行っていません。
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}" --target "${GITHUB_SHA}"
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}" --target "${GITHUB_SHA}"
          fi
