appId: com.hiho.audio
productName: hiho-cli-audio
asar: false
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: hiho-cli-audio
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
nsisWeb:
  artifactName: ${name}-${version}-windows-${arch}-web-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  target:
    - zip
  artifactName: ${name}-${version}-macos-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: 'このアプリケーションは音声録音のためにマイクアクセスを必要とします。'
  notarize: false
npmRebuild: false
